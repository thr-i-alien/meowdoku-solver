<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- 紫色霓虹外輪廓 -->
    <linearGradient id="favPurpleRim" x1="15" y1="8" x2="85" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A76BFF" />
      <stop offset="45%" stop-color="#8944FC" />
      <stop offset="100%" stop-color="#7022EA" />
    </linearGradient>

    <!-- 黑色毛皮漸層 -->
    <linearGradient id="favBlackFur" x1="50" y1="10" x2="50" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#36323F" />
      <stop offset="35%" stop-color="#211F29" />
      <stop offset="100%" stop-color="#121117" />
    </linearGradient>

    <!-- 內耳粉紅漸層 -->
    <linearGradient id="favInnerEar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF85A5" />
      <stop offset="50%" stop-color="#EB5782" />
      <stop offset="100%" stop-color="#A8284B" />
    </linearGradient>

    <!-- 白色面頰漸層 -->
    <linearGradient id="favWhiteFace" x1="50" y1="36" x2="50" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FAF9FD" />
      <stop offset="100%" stop-color="#DDD8E8" />
    </linearGradient>

    <!-- 粉嫩鼻子 -->
    <linearGradient id="favNoseGrad" x1="50" y1="62" x2="50" y2="67.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFAEC2" />
      <stop offset="40%" stop-color="#FF6992" />
      <stop offset="100%" stop-color="#D93664" />
    </linearGradient>

    <!-- 瞳孔深邃感 -->
    <radialGradient id="favPupilGrad" cx="38%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#1F1D24" />
      <stop offset="80%" stop-color="#0B0A0E" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
  </defs>

  <g>
    <!-- 1. 紫色外邊框光輪廓 -->
    <path
      d="M 20 10
         C 14 26, 12 46, 11 60
         C 10 76, 18 92, 50 94
         C 82 92, 90 76, 89 60
         C 88 46, 86 26, 80 10
         C 74 15, 67 24, 62 29
         C 57 26.5, 43 26.5, 38 29
         C 33 24, 26 15, 20 10 Z"
      fill="none"
      stroke="url(#favPurpleRim)"
      stroke-width="5"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- 2. 黑色毛皮與耳朵本體 -->
    <path
      d="M 20 10
         C 14 26, 12 46, 11 60
         C 10 76, 18 92, 50 94
         C 82 92, 90 76, 89 60
         C 88 46, 86 26, 80 10
         C 74 15, 67 24, 62 29
         C 57 26.5, 43 26.5, 38 29
         C 33 24, 26 15, 20 10 Z"
      fill="url(#favBlackFur)"
    />

    <!-- 3. 內耳粉紅 -->
    <path
      d="M 21.5 15.5
         C 19 28, 18 39, 21.5 46
         C 26 43, 33 37, 35.5 31
         C 31 23, 25 17, 21.5 15.5 Z"
      fill="url(#favInnerEar)"
    />
    <path
      d="M 78.5 15.5
         C 81 28, 82 39, 78.5 46
         C 74 43, 67 37, 64.5 31
         C 69 23, 75 17, 78.5 15.5 Z"
      fill="url(#favInnerEar)"
    />

    <!-- 4. 兩側小眉毛 -->
    <path d="M 28 39.5 C 31.5 37.5, 36.5 37.5, 39.5 39.5" stroke="#0B0A0E" stroke-width="3.2" stroke-linecap="round" />
    <path d="M 60.5 39.5 C 63.5 37.5, 68.5 37.5, 72 39.5" stroke="#0B0A0E" stroke-width="3.2" stroke-linecap="round" />

    <!-- 5. 白色面斑與圓滾包子臉頰 (賓士貓 White Blaze & Muzzle) -->
    <path
      d="M 50 37
         C 44.5 37, 43.5 45, 42.5 56
         C 37 58, 23 62, 17 71
         C 13 77, 16 85, 26 90.5
         C 34 93.5, 43 94, 50 94
         C 57 94, 66 93.5, 74 90.5
         C 84 85, 87 77, 83 71
         C 77 62, 63 58, 57.5 56
         C 56.5 45, 55.5 37, 50 37 Z"
      fill="url(#favWhiteFace)"
    />
    <!-- 下巴下緣陰影 -->
    <path d="M 24 89 C 35 94, 65 94, 76 89 C 67 93, 33 93, 24 89 Z" fill="#C6C1D6" opacity="0.8" />

    <!-- 6. 大眼睛 -->
    <!-- 左眼 -->
    <ellipse cx="34.5" cy="54" rx="8" ry="8.4" fill="#FFFFFF" stroke="#E2E0EC" stroke-width="0.5" />
    <ellipse cx="34.5" cy="54" rx="6.7" ry="7.1" fill="url(#favPupilGrad)" />
    <circle cx="32.4" cy="51.2" r="2.35" fill="#FFFFFF" />
    <circle cx="36.8" cy="56" r="1.15" fill="#FFFFFF" />

    <!-- 右眼 -->
    <ellipse cx="65.5" cy="54" rx="8" ry="8.4" fill="#FFFFFF" stroke="#E2E0EC" stroke-width="0.5" />
    <ellipse cx="65.5" cy="54" rx="6.7" ry="7.1" fill="url(#favPupilGrad)" />
    <circle cx="63.4" cy="51.2" r="2.35" fill="#FFFFFF" />
    <circle cx="67.8" cy="56" r="1.15" fill="#FFFFFF" />

    <!-- 7. 嘴巴（微開暗部與小舌尖） -->
    <path d="M 50 65.5 L 50 68" stroke="#BD7E92" stroke-width="1.2" stroke-linecap="round" />
    <path d="M 46.2 68.2 Q 50 70.4 53.8 68.2 Q 50 75 46.2 68.2 Z" fill="#501222" />
    <path d="M 47.8 71.2 Q 50 70 52.2 71.2 Q 50 74.4 47.8 71.2 Z" fill="#FF8DA4" />
    <path d="M 44.5 67.6 Q 47.5 69.3 50 68.2 Q 52.5 69.3 55.5 67.6" stroke="#945369" stroke-width="1.3" stroke-linecap="round" fill="none" />

    <!-- 8. 粉紅小鼻子 -->
    <path
      d="M 45.8 62.6
         C 47.3 61.3, 52.7 61.3, 54.2 62.6
         C 55.1 63.5, 52.2 66.5, 50 66.5
         C 47.8 66.5, 44.9 63.5, 45.8 62.6 Z"
      fill="url(#favNoseGrad)"
    />
    <ellipse cx="50" cy="62.5" rx="2.1" ry="0.65" fill="#FFFFFF" opacity="0.65" />

    <!-- 9. 兩側細白鬍鬚 -->
    <g stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" opacity="0.95">
      <path d="M 23 66 C 16 65.5, 10 66.5, 4 69" />
      <path d="M 22 71 C 15 72, 9 75.5, 5 78.5" />
      <path d="M 23 75.5 C 16 78, 11 82.5, 7 85.5" />
      <path d="M 77 66 C 84 65.5, 90 66.5, 96 69" />
      <path d="M 78 71 C 85 72, 91 75.5, 95 78.5" />
      <path d="M 77 75.5 C 84 78, 89 82.5, 93 85.5" />
    </g>
  </g>
</svg>